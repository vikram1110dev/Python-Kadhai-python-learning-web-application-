  <!-- Navigation Header -->
  <header class="app-header" id="main-header">
    <div class="header-content w-full">
      <!-- Logo Section -->
      <div class="logo-group">
        <div class="logo-icon">🐍</div>
        <div class="logo-text">Python Kadhai</div>
        <span class="badge badge-accent hidden md:inline-flex" style="display: none;">Tanglish</span>
      </div>

      <!-- Center Nav & Search (Desktop) -->
      <div class="header-center">
        <div class="header-search">
          <span class="header-search-icon">🔍</span>
          <input type="text" class="header-search-input" placeholder="Search lessons..." autocomplete="off">
        </div>
        <nav class="nav-menu">
          <button class="btn btn-ghost nav-btn active" id="nav-home">Home</button>
          <button class="btn btn-ghost nav-btn" id="nav-dashboard">Dashboard</button>
          <button class="btn btn-ghost nav-btn" id="nav-learn">Learn</button>
        </nav>
      </div>

      <!-- Right Actions (Gamification HUD) -->
      <div class="header-right">
        <div class="gamification-hud">
          <div class="hud-item streak-hud" title="Current Streak">
            <span class="hud-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg></span>
            <span class="hud-text" id="hud-streak">0</span>
          </div>
          <div class="hud-item coins-hud" title="Total Coins">
            <span class="hud-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="6"/><path d="M18.09 10.37A6 6 0 1 1 10.34 18"/><path d="M7 6h1v4"/><path d="M16.71 13.88.49 10.2l1.31-3.61 16.22 3.68z"/></svg></span>
            <span class="hud-text" id="hud-coins">0</span>
          </div>
          <div class="hud-item xp-hud" title="XP to Next Level">
            <span class="hud-icon" style="color: var(--accent-primary);"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg></span>
            <div class="xp-bar-container" aria-label="XP Progress Bar">
              <div class="xp-bar-fill" id="hud-xp-bar" style="width: 0%;"></div>
            </div>
          </div>
        </div>
        <button class="btn btn-secondary" id="btn-open-menu" style="display: none;" aria-label="Options Menu">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="21" x2="4" y2="14"></line><line x1="4" y1="10" x2="4" y2="3"></line><line x1="12" y1="21" x2="12" y2="12"></line><line x1="12" y1="8" x2="12" y2="3"></line><line x1="20" y1="21" x2="20" y2="16"></line><line x1="20" y1="12" x2="20" y2="3"></line><line x1="1" y1="14" x2="7" y2="14"></line><line x1="9" y1="8" x2="15" y2="8"></line><line x1="17" y1="16" x2="23" y2="16"></line></svg> Options
        </button>
        <div class="user-avatar" title="User Profile">VB</div>
        <button class="mobile-menu-btn" id="btn-mobile-menu" aria-label="Mobile Navigation Menu">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
        </button>
      </div>
    </div>

    <!-- Mobile Navigation Overlay -->
    <div class="mobile-nav-overlay" id="mobile-nav">
      <div class="header-search mb-4" style="max-width: 100%;">
        <span class="header-search-icon">🔍</span>
        <input type="text" class="header-search-input" placeholder="Search lessons..." autocomplete="off">
      </div>
      <button class="btn btn-ghost nav-btn w-full active" id="nav-home-mobile">Home</button>
      <button class="btn btn-ghost nav-btn w-full" id="nav-dashboard-mobile">Dashboard</button>
      <button class="btn btn-ghost nav-btn w-full" id="nav-learn-mobile">Learn</button>
      <button class="btn btn-secondary w-full mt-2" id="btn-open-menu-mobile">⚙️ Options</button>
    </div>
  </header>
